services:
  postgres:
    image: postgres:16-alpine
    container_name: wedding_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedding_app
      POSTGRES_PASSWORD: wedding_app
      POSTGRES_DB: wedding_app
    ports:
      - "5432:5432"
    volumes:
      - wedding_app_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  wedding_app_postgres_data:
