name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wedding_app
          POSTGRES_PASSWORD: wedding_app
          POSTGRES_DB: wedding_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wedding_app"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wedding-backend:ci backend
      - run: docker build -t wedding-frontend:ci frontend
  
  publish:
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/wedding-backend:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/wedding-backend:latest backend
          docker build -t ghcr.io/${{ github.repository_owner }}/wedding-frontend:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/wedding-frontend:latest frontend
          docker push --all-tags ghcr.io/${{ github.repository_owner }}/wedding-backend
          docker push --all-tags ghcr.io/${{ github.repository_owner }}/wedding-frontend


